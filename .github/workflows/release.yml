name: Release

# Publishes to PyPI when a version tag is pushed.
#
# Publishing is gated on the repository variable PUBLISH_TO_PYPI. Until it is
# set to "true", tagging a release builds and verifies the artifact but does not
# upload it -- so a tag can be pushed before PyPI is configured, and a fork can
# cut its own tags without credentials, without either producing a red run.
#
#   gh variable set PUBLISH_TO_PYPI --body true
#
# Uses PyPI Trusted Publishing, so there is no API token in this repo and
# nothing to leak or rotate. One-time setup on PyPI, before flipping it:
#
#   pypi.org -> Your projects -> Publishing -> Add a new pending publisher
#     PyPI project name : claude-desktop-session-restore
#     Owner             : YashShelar007
#     Repository        : claude-desktop-session-restore
#     Workflow name     : release.yml
#     Environment       : pypi
#
# Then: git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build
      - name: Tag must match the version in pyproject
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(ls dist/*.tar.gz | sed -E 's/.*claude_desktop_session_restore-(.*)\.tar\.gz/\1/')
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $tag does not match built version $pkg"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-skipped:
    # Says out loud why nothing was uploaded, so a green run is not mistaken for
    # a successful publish.
    needs: build
    if: vars.PUBLISH_TO_PYPI != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::notice::Built and verified, but not uploaded."
          echo "::notice::Set the PUBLISH_TO_PYPI repository variable to 'true' to publish."
